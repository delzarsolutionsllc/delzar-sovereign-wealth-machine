<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DELZAR OPS</title>
<style>
  :root { --bg:#0d1117; --panel:#161d26; --panel2:#1b2430; --line:#28313d;
          --text:#e6e1d7; --dim:#8a9199; --red:#e05252; --yellow:#e0b152;
          --green:#5fb26a; --accent:#c9a227; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text);
         font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
         margin:0; font-size:14px; line-height:1.45; }
  header { background:var(--panel); padding:0 24px; display:flex; gap:4px;
           align-items:center; border-bottom:2px solid var(--accent);
           position:sticky; top:0; z-index:10; }
  header .brand { font-weight:bold; color:var(--accent); font-size:16px;
                  letter-spacing:1px; margin-right:20px; padding:14px 0; }
  header .brand small { color:var(--dim); font-weight:normal; font-size:11px;
                        letter-spacing:0; display:block; }
  header a { color:var(--dim); text-decoration:none; padding:16px 14px;
             border-bottom:2px solid transparent; margin-bottom:-2px; }
  header a:hover { color:var(--text); }
  header a.active { color:var(--accent); border-bottom-color:var(--accent); }
  header .date { margin-left:auto; color:var(--dim); font-size:12px; }
  main { padding:24px; max-width:1150px; margin:0 auto; }
  h2 { color:var(--accent); font-size:13px; text-transform:uppercase;
       letter-spacing:2px; margin:28px 0 10px; }
  h2:first-child { margin-top:0; }
  h3 { font-size:14px; margin:18px 0 6px; }
  code { background:var(--panel2); padding:1px 6px; border-radius:3px; font-size:12px; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
           gap:12px; margin-bottom:8px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px;
          padding:12px 14px; }
  .card .label { color:var(--dim); font-size:11px; text-transform:uppercase;
                 letter-spacing:1px; }
  .card .value { font-size:22px; font-weight:bold; margin-top:4px; }
  .card .sub { color:var(--dim); font-size:11px; margin-top:2px; }
  .card.alert { border-color:var(--red); }
  .card.warn { border-color:var(--yellow); }

  table { border-collapse:collapse; width:100%; margin:8px 0 20px;
          background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  th, td { text-align:left; padding:7px 12px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:none; }
  th { color:var(--dim); font-weight:normal; font-size:11px; text-transform:uppercase;
       letter-spacing:1px; background:var(--panel2); }
  .num { text-align:right; }
  .OVERDUE { color:var(--red); font-weight:bold; }
  .URGENT { color:var(--yellow); }
  .UPCOMING { color:var(--dim); }
  .neg { color:var(--red); font-weight:bold; }
  .pos { color:var(--green); }
  .dim { color:var(--dim); }
  .badge { background:var(--panel2); border:1px solid var(--line); border-radius:3px;
           padding:1px 7px; font-size:11px; white-space:nowrap; }
  .badge.good { color:var(--green); border-color:var(--green); }
  .badge.bad { color:var(--red); border-color:var(--red); }
  a { color:var(--accent); }
  .empty { color:var(--dim); background:var(--panel); border:1px dashed var(--line);
           border-radius:6px; padding:14px; margin:8px 0 20px; }
</style>
</head>
<body>
<header>
  <span class="brand">DELZAR OPS<small>Delzar Solutions LLC · UEI TKMXZNCBPS27</small></span>
  <a href="/" class="{{ 'active' if active == 'home' }}">overview</a>
  <a href="/payroll" class="{{ 'active' if active == 'payroll' }}">payroll</a>
  <a href="/bids" class="{{ 'active' if active == 'bids' }}">bids</a>
  <a href="/cash" class="{{ 'active' if active == 'cash' }}">cash</a>
  <a href="/intel" class="{{ 'active' if active == 'intel' }}">intel</a>
  <span class="date">{{ today }}</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
