<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DELZAR OPS</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --text:#e6e1d7; --dim:#8a9199;
          --red:#e05252; --yellow:#e0b152; --green:#5fb26a; --accent:#c9a227; }
  body { background:var(--bg); color:var(--text); font-family:ui-monospace,Menlo,Consolas,monospace;
         margin:0; font-size:14px; }
  header { background:var(--panel); padding:12px 20px; display:flex; gap:24px; align-items:baseline;
           border-bottom:2px solid var(--accent); }
  header .brand { font-weight:bold; color:var(--accent); font-size:16px; }
  header a { color:var(--text); text-decoration:none; }
  header a:hover { color:var(--accent); }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  h2 { color:var(--accent); border-bottom:1px solid #333; padding-bottom:4px; font-size:15px; }
  table { border-collapse:collapse; width:100%; margin:8px 0 20px; }
  th, td { text-align:left; padding:5px 10px; border-bottom:1px solid #2a323b; }
  th { color:var(--dim); font-weight:normal; }
  .num { text-align:right; }
  .OVERDUE { color:var(--red); font-weight:bold; }
  .URGENT { color:var(--yellow); }
  .UPCOMING { color:var(--dim); }
  .neg { color:var(--red); font-weight:bold; }
  .pos { color:var(--green); }
  .dim { color:var(--dim); }
  .badge { background:#2a323b; border-radius:3px; padding:1px 6px; font-size:12px; }
</style>
</head>
<body>
<header>
  <span class="brand">DELZAR OPS</span>
  <a href="/">overview</a>
  <a href="/payroll">payroll</a>
  <a href="/bids">bids</a>
  <a href="/cash">cash</a>
  <a href="/intel">intel</a>
  <span class="dim" style="margin-left:auto">{{ today }}</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
