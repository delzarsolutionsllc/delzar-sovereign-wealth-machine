html, body, #root { height: 100%; width: 100%; overflow: hidden; }

.pin-subtitle {

.pin-label {

.pin-inputs { display: flex; gap: 12px; margin-bottom: 24px; }

.pin-inputs input:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(212,175,55,0.2); }
.pin-error { color: var(--red); font-size: 13px; margin-top: 8px; font-family: 'Courier New', monospace; }
.pin-success { color: var(--green); font-size: 13px; margin-top: 8px; font-family: 'Courier New', monospace; }

/* Status Bar */
.status-bar {

}
.status-logo {

}
.status-counters { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.status-counter {

}
.status-counter span { color: var(--gold); font-weight: 700; }
.status-clock {

/* Sidebar */
.sidebar {

  width: var(--sidebar-w); background: var(--dark2);

}
.sidebar.collapsed { transform: translateX(-100%); }
.sidebar-logo {

}
.sidebar-nav { flex: 1; padding: 8px 0; overflow-y: auto; }
.sidebar-item {

}
.sidebar-item:hover { background: var(--dark3); color: var(--text); }
.sidebar-item.active {

}
.sidebar-item .icon { font-size: 16px; width: 24px; text-align: center; }
.sidebar-footer {

.sidebar-footer .gold { color: var(--gold); }
.hamburger {

.sidebar-backdrop {

.main-content {

}

@keyframes fadeSlideIn {

/* Page header */
.page-header {

  border-bottom: 1px solid var(--gold-dim);
}

}

.badge-normal { background: var(--dark3); color: var(--text-dim); }

.btn:hover { background: var(--gold); color: var(--dark); border-color: var(--gold); }

.btn-sm { padding: 4px 10px; font-size: 11px; }

/* Inputs */
.input, .select, .textarea {

.input:focus, .select:focus, .textarea:focus { border-color: var(--gold); }
.textarea { resize: vertical; min-height: 80px; }
.label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; display: block; font-family: 'Courier New', monospace; letter-spacing: 1px; }

/* Grid */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.flex-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }

.dot-gold { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.dot-red { background: #ff4444; box-shadow: 0 0 6px #ff4444; }

.checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }

/* Print */
@media print {

  .main-content { margin: 0 !important; padding: 0 !important; }
  body { background: #fff !important; color: #000 !important; }
  .printable-document {

/* Mobile */

  .sidebar-backdrop.show { display: block; }
  .main-content { margin-left: 0; padding: 16px; }
  .status-counters { display: none; }

  .ring-inner { width: 80px; height: 80px; top: 70px; left: 70px; }
}
</style>

// ── HELPER FUNCTIONS ──
function daysUntil(dateStr) {
  const now = new Date(); now.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.ceil((target - now) / 86400000);
}

function daysUntilDate(y, m, d) {
  const now = new Date(); now.setHours(0,0,0,0);
  const target = new Date(y, m - 1, d);
  return Math.ceil((target - now) / 86400000);
}

function playBadgeClass(play) {
  if (play === 'BID_DIRECT') return 'badge-bid';
  if (play === 'DROPSHIP') return 'badge-dropship';
  if (play === 'SUB_CONTRACT') return 'badge-sub';
  return 'badge-match';
}

function playLabel(play) {
  if (play === 'BID_DIRECT') return 'BID DIRECT';
  if (play === 'DROPSHIP') return 'DROPSHIP';
  if (play === 'SUB_CONTRACT') return 'SUB-CONTRACT';
  return 'MATCH-MAKE';
}

}

// ================================================================
function PinLock({ onUnlock }) {
  const stored = localStorage.getItem(LS_PREFIX + 'pin');
  const [mode, setMode] = useState(stored ? 'enter' : 'create');
  const [pin, setPin] = useState(['','','','']);
  const [confirm, setConfirm] = useState(['','','','']);
  const [phase, setPhase] = useState('first'); // first | confirm
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  const refs = [useRef(), useRef(), useRef(), useRef()];
  const cRefs = [useRef(), useRef(), useRef(), useRef()];

  function handleInput(arr, setArr, inputRefs, idx, val) {
    if (val.length > 1) val = val.slice(-1);
    if (!/^\d?$/.test(val)) return;
    const next = [...arr]; next[idx] = val; setArr(next); setError('');
    if (val && idx < 3) inputRefs[idx + 1].current.focus();
    // Check if complete
    if (val && idx === 3) {
      const code = next.join('');
      if (mode === 'enter') {
        if (btoa(code) === stored) {
          setSuccess('ACCESS GRANTED');
          sessionStorage.setItem(LS_PREFIX + 'session', '1');
          setTimeout(() => onUnlock(), 600);
        } else {
          setError('INVALID PIN');
          setArr(['','','','']);
          setTimeout(() => inputRefs[0].current && inputRefs[0].current.focus(), 100);
        }
      } else if (phase === 'first') {
        setSuccess('CONFIRM PIN');
        setTimeout(() => { setPhase('confirm'); setSuccess(''); cRefs[0].current && cRefs[0].current.focus(); }, 600);
      }
    }
  }

  function handleConfirmComplete() {
    const code = pin.join('');
    const cCode = confirm.join('');
    if (code === cCode) {
      localStorage.setItem(LS_PREFIX + 'pin', btoa(code));
      sessionStorage.setItem(LS_PREFIX + 'session', '1');
      setSuccess('PIN CREATED \u2014 ACCESS GRANTED');
      setTimeout(() => onUnlock(), 800);
    } else {
      setError('PINS DO NOT MATCH');
      setPin(['','','','']); setConfirm(['','','','']); setPhase('first');
      setTimeout(() => refs[0].current && refs[0].current.focus(), 100);
    }
  }

  useEffect(() => {
    if (phase === 'confirm' && confirm.every(c => c !== '')) handleConfirmComplete();
  }, [confirm]);

  useEffect(() => { refs[0].current && refs[0].current.focus(); }, []);

  function handleKeyDown(arr, setArr, inputRefs, idx, e) {
    if (e.key === 'Backspace' && !arr[idx] && idx > 0) {
      inputRefs[idx - 1].current.focus();
    }
  }

  return (
    React.createElement("div", { className: "pin-screen" },
      React.createElement("div", { className: "pin-monogram" }, "DZ"),
      React.createElement("div", { className: "pin-title" }, "DELZAR FORGE"),
      React.createElement("div", { className: "pin-subtitle" }, "CLASSIFIED \u2014 AUTHORIZED ACCESS ONLY"),
      React.createElement("div", { className: "pin-label" },
        mode === 'enter' ? 'ENTER PIN' : (phase === 'first' ? 'CREATE PIN' : 'CONFIRM PIN')
      ),
      (phase === 'first' || mode === 'enter') && React.createElement("div", { className: "pin-inputs" },
        [0,1,2,3].map(i =>
          React.createElement("input", {
            key: i, ref: refs[i], type: "password", maxLength: 1, value: pin[i],
            onChange: e => handleInput(pin, setPin, refs, i, e.target.value),
            onKeyDown: e => handleKeyDown(pin, setPin, refs, i, e)
          })
        )
      ),
      phase === 'confirm' && React.createElement("div", { className: "pin-inputs" },
        [0,1,2,3].map(i =>
          React.createElement("input", {
            key: 'c'+i, ref: cRefs[i], type: "password", maxLength: 1, value: confirm[i],
            onChange: e => handleInput(confirm, setConfirm, cRefs, i, e.target.value),
            onKeyDown: e => handleKeyDown(confirm, setConfirm, cRefs, i, e)
          })
        )
      ),
      error && React.createElement("div", { className: "pin-error" }, error),
      success && React.createElement("div", { className: "pin-success" }, success)
    )
  );
}

// ================================================================
// APP ROOT
// ================================================================
function App() {
  const [unlocked, setUnlocked] = useState(sessionStorage.getItem(LS_PREFIX + 'session') === '1');
  const [page, setPage] = useState('procurement');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [toasts, setToasts] = useState([]);

  function toast(msg) {
    setToasts(prev => [...prev, msg]);
    setTimeout(() => setToasts(prev => prev.slice(1)), 3000);
  }

  if (!unlocked) {
    return React.createElement(PinLock, { onUnlock: () => setUnlocked(true) });
  }

  function renderPage() {
    switch(page) {
      case 'procurement': return React.createElement(ProcurementPage, null);
      case 'capstatement': return React.createElement(CapStatementPage, null);
      case 'proposals': return React.createElement(ProposalPage, null);
      case 'intel': return React.createElement(IntelPage, null);
      case 'darkeconomy': return React.createElement(DarkEconomyPage, null);
      case 'contacts': return React.createElement(ContactsPage, null);
      case 'documents': return React.createElement(DocumentsPage, null);
      case 'terminal': return React.createElement(TerminalPage, null);
      default: return React.createElement(ProcurementPage, null);
    }
  }

  return (
    React.createElement("div", null,
      React.createElement(StatusBar, null),
      React.createElement("button", { className: "hamburger", onClick: () => setSidebarOpen(!sidebarOpen) }, sidebarOpen ? "\u2715" : "\u2630"),
      React.createElement(Sidebar, { activePage: page, onNavigate: setPage, open: sidebarOpen, onClose: () => setSidebarOpen(false) }),
      React.createElement("div", { className: "main-content", key: page },
        renderPage()
      ),
      React.createElement(ToastContainer, { toasts: toasts })
    )
  );
}
