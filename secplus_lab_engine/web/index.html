<title>Security+ Lab Engine</title>

<!--SECPLUS_MODE-->
<style>
/* Layout: course map rail (domains → labs) beside a working pane with Lesson / Scenario / Practice tabs.
   Subject: a SOC analyst's study console — certificate-blue accent, mono for anything an engine prints. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunken: #e9edf2; --ink: #17202b; --muted: #566273; --line: #d6dde6;
  --accent: #1b5a8c; --accent-soft: #dce8f3; --on-accent: #ffffff;
  --pass: #1d7348; --pass-soft: #dcefe4; --warn: #94600a; --warn-soft: #f6ead2; --fail: #ad2a22; --fail-soft: #f7e0de;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #151c25; --sunken: #111820; --ink: #e3e9f0; --muted: #9aa8b8; --line: #283442;
  --accent: #74b2e6; --accent-soft: #1a2c3d; --on-accent: #0b1622;
  --pass: #63c993; --pass-soft: #15291f; --warn: #e2a74e; --warn-soft: #2c2312; --fail: #f08a80; --fail-soft: #33191a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c25; --sunken: #111820; --ink: #e3e9f0; --muted: #9aa8b8; --line: #283442;
  --accent: #74b2e6; --accent-soft: #1a2c3d; --on-accent: #0b1622;
  --pass: #63c993; --pass-soft: #15291f; --warn: #e2a74e; --warn-soft: #2c2312; --fail: #f08a80; --fail-soft: #33191a;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.05rem; }
code, pre, .mono { font-family: var(--mono); }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }

.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand b { font-family: var(--display); font-size: 1.2rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a, .lablink { display: flex; gap: 10px; align-items: baseline; padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; }
.nav a:hover, .lablink:hover { background: var(--sunken); }
.nav a.on, .lablink.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.lablink .num { font-family: var(--mono); font-size: .78rem; color: var(--muted); min-width: 1.6em; text-align: right; }
.lablink.on .num { color: var(--accent); }
.domain { display: flex; flex-direction: column; gap: 2px; }
.domain-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 8px 4px; }
.mode { margin-top: auto; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.mode b { color: var(--ink); font-weight: 600; }
.maptoggle { display: none; }

.main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { background: none; border: 0; padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-weight: 500; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }

.lesson { max-width: 68ch; display: flex; flex-direction: column; gap: 10px; }
.lesson p, .lesson ul { margin: 0; } .lesson ul { padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.lesson pre { background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-size: .82rem; margin: 0; }

.insight { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }

.bar > i { display: block; height: 100%; background: var(--accent); }
.ctx { background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin: 0; font-size: .8rem; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 42vh; overflow-y: auto; }
.prompt { font-size: 1.08rem; font-weight: 600; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.choice .k { font-family: var(--mono); color: var(--muted); font-size: .8rem; min-width: 1.2em; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice.right { border-color: var(--pass); background: var(--pass-soft); }
.choice.wrong { border-color: var(--fail); background: var(--fail-soft); }
.verdict { border-left: 3px solid var(--line); padding: 8px 12px; background: var(--sunken); border-radius: 0 6px 6px 0; }
.verdict.ok { border-left-color: var(--pass); } .verdict.no { border-left-color: var(--fail); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .75rem; font-weight: 600; letter-spacing: .03em; }
.pill.PASS { background: var(--pass-soft); color: var(--pass); } .pill.WARN, .pill.MEDIUM { background: var(--warn-soft); color: var(--warn); }
.pill.FAIL, .pill.LOW { background: var(--fail-soft); color: var(--fail); }

.grid5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.dcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink); }
.dcard:hover { border-color: var(--accent); }
.dcard .w { font-family: var(--mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.meter { width: 110px; height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; display: inline-block; vertical-align: middle; }
.meter > i { display: block; height: 100%; }
.scale { position: relative; height: 34px; }
.scale .track { position: absolute; top: 14px; left: 0; right: 0; height: 6px; border-radius: 99px; background: var(--sunken); }
.scale .pass { position: absolute; top: 6px; width: 2px; height: 22px; background: var(--ink); }
.scale .you { position: absolute; top: 10px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-7px); }
.timer { font-family: var(--mono); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--fail); }
.form { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); max-width: 100%; min-width: 0; }
.form select { max-width: 100%; }
.form select, .form input[type=number] { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.notice { padding: 10px 12px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.loading { color: var(--muted); font-style: italic; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 12px; }
  .maptoggle { display: inline-flex; }
  .rail:not(.open) .domains, .rail:not(.open) .mode { display: none; }
  .railtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
}
.vlist { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 6px; }
.vlist li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.vlist li.seen a { color: var(--muted); }
.vlist input { margin: 0; accent-color: var(--accent); }
.watchfirst { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 16px; }
.vstep + .vstep { border-top: 1px solid var(--line); padding-top: 8px; }
.ticket { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; background: var(--surface); }
.ticket-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ticket h2 { margin: 6px 0; } .ticket h3 { margin: 6px 0 2px; font-size: .95rem; }
.ticket-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.ticket dt { font-weight: 600; } .ticket dd { margin: 0 0 6px; color: var(--muted); }
.casestudy .note { border-left: 3px solid var(--accent); padding: 4px 10px; color: var(--muted); font-size: .9rem; }
.casestudy .ticketline { font-family: var(--mono); font-size: .85rem; }
.skill { display: inline-block; background: var(--sunken); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin: 2px 4px 2px 0; font-size: .85rem; }
ol.path li { margin-bottom: 8px; }
a.done { font-weight: 600; }
@media print { .rail, .tabs, .noprint, .panel:not(#labbody) { display: none !important; } .main, #labbody { padding: 0; border: 0; box-shadow: none; } body { background: #fff; } }
@media (prefers-reduced-motion: no-preference) { .bar > i, .meter > i { transition: width .3s ease; } }
</style>

<div class="app">
  <aside class="rail" id="rail">
    <div class="railtop">
      <div class="brand"><span class="label">CompTIA SY0-701</span><b>Security+ Lab Engine</b></div>

    </div>

<script>
"use strict";
/* ------------------------------------------------------------------ helpers */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
};
const put = (node, ...kids) => node.replaceChildren(...kids.flat().filter(c => c != null && c !== false));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const newSeed = () => Math.floor(Math.random() * 1e9);
const pct = (c, t) => (t ? Math.round(100 * c / t) : 0);

const OBJ = {
  "1.1": "Security controls", "1.2": "Security concepts / Zero Trust", "1.3": "Change management", "1.4": "Cryptography & PKI",
  "2.1": "Threat actors & motivations", "2.2": "Threat vectors & attack surfaces", "2.3": "Types of vulnerabilities",
  "2.4": "Indicators of malicious activity", "2.5": "Mitigation techniques",
  "3.1": "Architecture models", "3.2": "Secure enterprise infrastructure", "3.3": "Data protection", "3.4": "Resilience & recovery",
  "4.1": "Secure baselines & hardening", "4.2": "Asset management", "4.3": "Vulnerability management", "4.4": "Alerting & monitoring",
  "4.5": "Enterprise security capabilities", "4.6": "Identity & access management", "4.7": "Automation & orchestration",
  "4.8": "Incident response", "4.9": "Investigation data sources",
  "5.1": "Security governance", "5.2": "Risk management", "5.3": "Third-party risk", "5.4": "Compliance", "5.5": "Audits & assessments", "5.6": "Security awareness",
};

/* ------------------------------------------------------------------ engine adapter
   Live mode (python main.py web): every call goes to the local engine.
   Hosted mode: the same calls are answered from course_data.json.          */
const LIVE = typeof window.SECPLUS_API === "string";
let BUNDLE = null, CATALOG = null;

async function post(method, args = {}) {
  const r = await fetch(`${window.SECPLUS_API}/${method}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(args) });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `Request failed (${r.status})`);
  return body;
}

const Engine = {
  async catalog() {
    if (LIVE) return post("catalog");
    if (window.SECPLUS_BUNDLE) { BUNDLE = window.SECPLUS_BUNDLE; return BUNDLE.catalog; }   // single-file desktop app
    const r = await fetch("course_data.json");
    if (!r.ok) throw new Error("course_data.json could not be loaded");
    BUNDLE = await r.json();
    return BUNDLE.catalog;
  },
  async run(lab, random, seed) {
    if (LIVE) return post("run", { lab, random, seed });
    const L = BUNDLE.labs[lab];
    if (!random || !L.variants.length) return { text: L.sample.run, seed: null };
    const v = L.variants[seed % L.variants.length];
    return { text: v.run, seed: v.seed };
  },
  async challenge(lab, random, seed) {
    if (LIVE) return post("challenge", { lab, random, seed });
    const L = BUNDLE.labs[lab];
    const src = random && L.variants.length ? L.variants[seed % L.variants.length] : L.sample;
    return { questions: shuffle(src.questions, mulberry32(seed || 1)), seed: src.seed ?? null };
  },
  async caseStudy(lab) {
    if (LIVE) return post("case_study", { lab });
    return BUNDLE.labs[lab].case_study;
  },
  async exam(count, seed, fixed, domain, source = "bank") {
    if (LIVE) return post("exam", { count, seed, fixed, domain: domain || null, source });
    return domain ? buildDomainTestLocal(count, seed, domain, source) : buildExamLocal(count, seed, source);
  },
};

/* Exam questions: the exam-style bank (original questions written like SY0-701) by default,
   or the labs' hands-on scenario questions. Bank options are shuffled per exam.            */
const useBank = source => source !== "labs" && (BUNDLE.exam_bank || []).length > 0;
const bankQ = (r, rnd) => ({ ...r, id: r.id, prompt: r.stem, context: "", choices: shuffle(r.choices, rnd), answer: r.answer, explanation: r.explanation, objective: r.objective });
/* Is answer a correct for question q? Single-answer questions compare text; other question types extend this. */
function isCorrect(q, a) { return a === q.answer; }
function* allExamQuestions(source, rnd) {
  if (useBank(source)) { for (const r of BUNDLE.exam_bank) yield bankQ(r, rnd); return; }
  for (const L of Object.values(BUNDLE.labs)) for (const src of [L.sample, ...L.variants]) yield* src.questions;
}
function buildExamLocal(count, seed, source = "bank") {
  const rnd = mulberry32(seed);
  const pool = {}; const seen = new Set();
  CATALOG.domains.forEach(d => pool[d.id] = []);
  for (const q of allExamQuestions(source, rnd)) {
    const key = [q.prompt, q.context, ...[...q.choices].sort()].join("\u0000"), d = q.objective.split(".")[0];
    if (seen.has(key) || !pool[d]) continue; seen.add(key); pool[d].push(q);
  }
  // largest-remainder allocation by official weight, shortfall moved to other domains
  const raw = Object.fromEntries(CATALOG.domains.map(d => [d.id, count * d.weight]));
  const alloc = Object.fromEntries(Object.entries(raw).map(([d, v]) => [d, Math.floor(v)]));
  let left = count - Object.values(alloc).reduce((a, b) => a + b, 0);
  Object.keys(raw).sort((a, b) => (raw[b] - alloc[b]) - (raw[a] - alloc[a])).slice(0, left).forEach(d => alloc[d]++);
  const shortfall = {};
  for (const d in alloc) if (alloc[d] > pool[d].length) { shortfall[d] = alloc[d] - pool[d].length; alloc[d] = pool[d].length; }
  let spare = count - Object.values(alloc).reduce((a, b) => a + b, 0);
  const byWeight = CATALOG.domains.slice().sort((a, b) => b.weight - a.weight).map(d => d.id);
  while (spare > 0) { const room = byWeight.filter(d => alloc[d] < pool[d].length); if (!room.length) break; for (const d of room) { if (!spare) break; alloc[d]++; spare--; } }
  let qs = []; for (const d in alloc) qs = qs.concat(shuffle(pool[d], rnd).slice(0, alloc[d]));
  return { questions: shuffle(qs, rnd), allocation: alloc, shortfall };
}

function buildDomainTestLocal(count, seed, domain, source = "bank") {
  // one domain only, spread evenly over its objectives (round-robin), like utils/exam.build_domain_test
  const rnd = mulberry32(seed), seen = new Set(), byObj = {};
  for (const q of allExamQuestions(source, rnd)) {
    const key = [q.prompt, q.context, ...[...q.choices].sort()].join("\u0000");
    if (q.objective.split(".")[0] !== domain || seen.has(key)) continue; seen.add(key); (byObj[q.objective] ||= []).push(q);
  }
  const order = Object.keys(byObj).sort((a, b) => parseFloat(a) - parseFloat(b) || a.localeCompare(b));
  for (const o of order) byObj[o] = shuffle(byObj[o], rnd);
  const picked = [];
  while (picked.length < count && order.some(o => byObj[o].length)) for (const o of order) if (byObj[o].length && picked.length < count) picked.push(byObj[o].pop());
  const allocation = {}; picked.forEach(q => allocation[q.objective] = (allocation[q.objective] || 0) + 1);
  return { questions: shuffle(picked, rnd), domain, allocation, shortfall: {}, target: CATALOG.domain_test_target };
}

/* ------------------------------------------------------------------ progress store
   Live: progress.json on this computer. Hosted: your private document in this
   page's store (claude.ai account), else this browser's storage, else memory.   */
const EMPTY = () => ({ objectives: {}, sessions: [], watched: [] });
function rating(p, n) { if (n < 3) return p < 50 ? "LOW" : "MEDIUM"; return p >= 85 ? "PASS" : p >= 65 ? "WARN" : "FAIL"; }
function rowsOf(data) {
  return Object.entries(data.objectives).map(([o, s]) => [o, s.attempted, s.correct, pct(s.correct, s.attempted) + "%", rating(pct(s.correct, s.attempted), s.attempted)])
    .sort((a, b) => parseFloat(a[3]) - parseFloat(b[3]) || a[0].localeCompare(b[0]));
}
const Progress = {
  where: LIVE ? "progress.json on this computer" : "this browser",
  cache: null, remote: null,
  async init() {
    if (LIVE) return;
    try { this.cache = JSON.parse(localStorage.getItem("secplus-progress") || "null"); } catch { this.cache = null; }
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const id = db && user ? await user.id() : null;
      if (!id) return;
      const ref = db.doc("data/users/" + id + "/progress");
      const snap = await ref.get();
      this.remote = ref; this.where = "your claude.ai account (private to you)";
      if (snap.exists) this.cache = JSON.parse(JSON.stringify(snap.data()));
      renderMode();
      const h = location.hash || "#home";
      if (h === "#home" || h === "#progress") route();      // refresh views that show scores; never interrupt a quiz
    } catch { /* stay on browser storage */ }
  },
  async get() {
    if (LIVE) return post("progress_get");
    const d = this.cache || EMPTY();
    return { ...d, watched: d.watched || [], rows: rowsOf(d) };
  },
  async watch(video, watched) {
    if (LIVE) return post("progress_watch", { video, watched });
    const d = this.cache ? JSON.parse(JSON.stringify(this.cache)) : EMPTY();
    d.watched = (d.watched || []).filter(v => v !== video);
    if (watched) d.watched.push(video);
    await this.save(d);
    return { ...d, rows: rowsOf(d) };
  },
  async record(results, label) {
    if (LIVE) return post("progress_record", { results, label });
    const d = this.cache ? JSON.parse(JSON.stringify(this.cache)) : EMPTY();
    let correct = 0;
    for (const r of results) { const s = d.objectives[r.objective] ||= { attempted: 0, correct: 0 }; s.attempted++; if (r.correct) { s.correct++; correct++; } }
    d.sessions.push({ ts: new Date().toISOString().slice(0, 19), lab: String(label), score: `${correct}/${results.length}` });
    d.sessions = d.sessions.slice(-50);
    await this.save(d);
    return { ...d, rows: rowsOf(d) };
  },
  async reset() { if (LIVE) return post("progress_reset"); await this.save(EMPTY()); return { ...EMPTY(), rows: [] }; },
  async save(d) {
    this.cache = d;
    try { localStorage.setItem("secplus-progress", JSON.stringify(d)); } catch { /* storage blocked */ }
    if (this.remote) { try { await this.remote.set(d); } catch { /* keep local copy */ } }
  },
};

    });

/* ------------------------------------------------------------------ router & boot */
function route() {
  clearInterval(examTimer); setKeys(null);
  const h = (location.hash || "#home").slice(1);
  $("#rail").classList.remove("open"); $("#maptoggle").setAttribute("aria-expanded", "false");
  const m = h.match(/^lab-(\d+)$/);
  if (m) return viewLab(parseInt(m[1], 10));
  if (h === "exam") return viewExam();
  const dm = h.match(/^exam-d([1-5])$/);
  if (dm) return viewExam(dm[1]);
  if (h === "progress") return viewProgress();
  if (h === "videos") return viewVideos();
  if (h === "career") return viewCareer();
  return viewHome();
}

$("#maptoggle").addEventListener("click", () => { const r = $("#rail"); r.classList.toggle("open"); $("#maptoggle").setAttribute("aria-expanded", String(r.classList.contains("open"))); });

(async function boot() {
  try {

    window.addEventListener("hashchange", route);
    Progress.init();
  } catch (e) {
    put(view(), el("section", { class: "panel" }, el("h2", { text: "The course could not load" }),
      el("p", { class: "notice", text: e.message }),
      el("p", { class: "muted", text: LIVE ? "Check the terminal window running `python main.py web` for errors." : "Reload the page. If it keeps failing, run the course locally with `python main.py web`." })));
  }
})();
