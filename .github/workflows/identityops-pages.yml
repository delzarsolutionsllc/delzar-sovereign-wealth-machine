name: delzar-academy-pages

# Publishes Delzar Certification Academy (the installable offline web app) to GitHub Pages.
# PRIVATE MODE: the owner keeps the academy private (see secplus_lab_engine/docs/PRIVATE_HOSTING.md),
# so this public GitHub Pages deploy no longer runs on push. It only runs by hand from the Actions tab.
# One-time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". The site is then at
# https://delzarsolutionsllc.github.io/delzar-sovereign-wealth-machine/

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secplus_lab_engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before publishing
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
      - name: Build the site
        run: python tools/build_site.py --out dist/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: secplus_lab_engine/dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
