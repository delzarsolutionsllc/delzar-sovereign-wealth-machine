<script>
// ===== PARTICLE GRID BACKGROUND =====
(function(){
  const c=document.getElementById('particle-canvas'),ctx=c.getContext('2d');
  let w,h,particles=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  window.addEventListener('resize',resize);resize();
  for(let i=0;i<60;i++)particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.5});
  function draw(){
    ctx.clearRect(0,0,w,h);
    // Grid lines
    ctx.strokeStyle='rgba(212,175,55,.04)';ctx.lineWidth=.5;
    for(let x=0;x<w;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
    for(let y=0;y<h;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
    // Particles
    particles.forEach((p,i)=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>w)p.vx*=-1;
      if(p.y<0||p.y>h)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(212,175,55,.5)';ctx.fill();
      // Connect nearby particles
      for(let j=i+1;j<particles.length;j++){
        const dx=p.x-particles[j].x,dy=p.y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<150){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(particles[j].x,particles[j].y);
        ctx.strokeStyle=`rgba(212,175,55,${.12*(1-dist/150)})`;ctx.lineWidth=.5;ctx.stroke()}
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

function SprintChecklist(){
  const storageKey='delzar-sprint-v1';
  const [checked,setChecked]=useState(()=>{
    try{return JSON.parse(localStorage.getItem(storageKey))||{}}catch(e){return{}}
  });

  const toggle=useCallback((dayIdx,itemIdx)=>{
    setChecked(prev=>{
      const key=`${dayIdx}-${itemIdx}`;
      const next={...prev,[key]:!prev[key]};
      localStorage.setItem(storageKey,JSON.stringify(next));
      return next;
    });
  },[]);

  const totalItems=SPRINT_DAYS.reduce((a,d)=>a+d.items.length,0);
  const doneItems=Object.values(checked).filter(Boolean).length;

  return(
    <div>
      <div style={{fontFamily:'var(--mono)',fontSize:'.75rem',color:'var(--text-dim)',marginBottom:'12px',textAlign:'right'}}>
        {doneItems} / {totalItems} COMPLETE ({Math.round(doneItems/totalItems*100)}%)
      </div>
      <div className="sprint-days">
        {SPRINT_DAYS.map((d,di)=>(
          <div className="sprint-day" key={di}>
            <div className="sprint-day-header">{d.day}</div>
            {d.items.map((item,ii)=>{
              const key=`${di}-${ii}`;
              const isDone=!!checked[key];
              return(
                <div className={`sprint-item ${isDone?'done':''}`} key={ii} onClick={()=>toggle(di,ii)}>
                  <div className={`sprint-checkbox ${isDone?'checked':''}`}>{isDone?'\u2713':''}</div>
                  <span className="sprint-item-text">{item}</span>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}
