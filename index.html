<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Delzar Sovereign Wealth Machine | Command Center</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#D4AF37;--gold-dim:#8B7523;--dark:#0D0D0D;--dark2:#1A1A1A;--dark3:#2A2A2A;--dark4:#333;
  --red:#8B0000;--red-bright:#CC0000;--green:#006600;--green-bright:#00AA00;
  --blue:#1E90FF;--purple:#9B59B6;--orange:#E67E22;--yellow:#DAA520;
  --text:#E0E0E0;--text-dim:#888;--mono:'Consolas','Courier New',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ===== PARTICLE BACKGROUND ===== */
#particle-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.15}

/* ===== LAYOUT ===== */
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0 16px;border-bottom:1px solid var(--gold-dim);margin-bottom:20px}
.header h1{font-family:var(--mono);font-size:2.2rem;letter-spacing:6px;color:var(--gold);text-shadow:0 0 20px rgba(212,175,55,.3)}
.header .logo{font-size:3rem;font-weight:900;letter-spacing:12px;margin-bottom:4px}
.header .subtitle{font-size:.85rem;color:var(--text-dim);letter-spacing:3px;text-transform:uppercase;margin-top:4px}
.header .tagline{font-size:.7rem;color:var(--gold-dim);letter-spacing:2px;margin-top:2px}

.section{margin-bottom:24px}
.section-title{font-family:var(--mono);font-size:1rem;color:var(--gold);letter-spacing:3px;text-transform:uppercase;padding-bottom:8px;border-bottom:1px solid var(--dark3);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';display:inline-block;width:8px;height:8px;background:var(--gold);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%)}

/* ===== ENGINE CARDS ===== */
.engine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.engine-card{background:var(--dark2);border:1px solid var(--dark3);border-radius:6px;padding:14px;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.engine-card:hover{border-color:var(--gold-dim);box-shadow:0 0 15px rgba(212,175,55,.1)}
.engine-card .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.engine-card .card-label{font-family:var(--mono);font-size:.65rem;color:var(--gold-dim);letter-spacing:2px}
.engine-card .card-title{font-size:.95rem;font-weight:700;color:#fff;margin-bottom:6px}
.engine-card .card-target{font-family:var(--mono);font-size:.75rem;color:var(--green-bright)}
.engine-card .card-edge{font-size:.7rem;color:var(--text-dim);margin-top:6px;font-style:italic}

.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.status-dot.green{background:var(--green-bright);box-shadow:0 0 8px var(--green-bright)}
.status-dot.yellow{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.status-dot.red{background:var(--red-bright);box-shadow:0 0 8px var(--red-bright)}
.status-dot.blue{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.status-dot.gray{background:#666;box-shadow:0 0 8px #666}
.status-dot.pulse{animation:pulse 2s ease-in-out infinite}

.status-badge{font-family:var(--mono);font-size:.6rem;padding:2px 8px;border-radius:3px;letter-spacing:1px;white-space:nowrap}
.status-badge.setup{background:rgba(218,165,32,.15);color:var(--yellow);border:1px solid var(--yellow)}
.status-badge.ready{background:rgba(0,170,0,.12);color:var(--green-bright);border:1px solid var(--green-bright)}
.status-badge.registering{background:rgba(30,144,255,.12);color:var(--blue);border:1px solid var(--blue)}
.status-badge.build{background:rgba(155,89,182,.12);color:var(--purple);border:1px solid var(--purple)}
.status-badge.connected{background:rgba(0,170,0,.12);color:var(--green-bright);border:1px solid var(--green-bright)}

.multiplier-card{border-color:var(--gold-dim)!important;background:linear-gradient(135deg,var(--dark2),rgba(212,175,55,.05))}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

/* ===== REVENUE CHART ===== */
.chart-container{background:var(--dark2);border:1px solid var(--dark3);border-radius:6px;padding:16px;overflow-x:auto}
.chart{display:flex;align-items:flex-end;gap:6px;height:260px;padding:0 4px;min-width:600px}
.chart-bar-group{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.chart-stack{display:flex;flex-direction:column-reverse;width:100%;max-width:60px;position:relative}
.chart-segment{transition:height 1.5s ease-out;min-height:0;border-radius:2px 2px 0 0}
.chart-segment.govcon{background:var(--gold)}
.chart-segment.intel{background:var(--blue)}
.chart-segment.tribal{background:var(--red-bright)}
.chart-segment.saas{background:var(--purple)}
.chart-month{font-family:var(--mono);font-size:.6rem;color:var(--text-dim);margin-top:6px;text-align:center}
.chart-total-label{font-family:var(--mono);font-size:.55rem;color:var(--text-dim);margin-top:2px;text-align:center}
.chart-legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--text-dim)}
.chart-legend-swatch{width:12px;height:12px;border-radius:2px}

.september-glow{animation:septGlow 2s ease-in-out infinite;position:relative}
.september-glow::after{content:'';position:absolute;inset:-3px;border:1px solid var(--red-bright);border-radius:4px;animation:septGlow 2s ease-in-out infinite}
@keyframes septGlow{0%,100%{box-shadow:0 0 8px rgba(204,0,0,.4)}50%{box-shadow:0 0 20px rgba(204,0,0,.8)}}

.year-total{text-align:center;margin-top:16px;font-family:var(--mono);font-size:1.6rem;color:var(--gold);text-shadow:0 0 12px rgba(212,175,55,.3)}
.year-total span{font-size:.75rem;color:var(--text-dim);display:block;letter-spacing:2px}

/* ===== SPENDING CALENDAR ===== */
.calendar-bar{display:flex;height:40px;border-radius:4px;overflow:hidden;margin-bottom:8px}
.calendar-segment{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.55rem;color:#fff;letter-spacing:1px;transition:all .3s}
.cal-medium{background:var(--yellow);color:#000}
.cal-med-high{background:var(--orange)}
.cal-high{background:#D4500A}
.cal-very-high{background:#CC2200}
.cal-maximum{background:var(--red-bright);animation:maxPulse 1.5s ease-in-out infinite}
@keyframes maxPulse{0%,100%{background-color:#8B0000;box-shadow:inset 0 0 10px rgba(255,0,0,.3)}50%{background-color:#CC0000;box-shadow:inset 0 0 20px rgba(255,0,0,.6)}}
.cal-stat{font-family:var(--mono);font-size:.75rem;color:var(--red-bright);text-align:center;margin-top:6px}

/* ===== TERO TABLE ===== */
.tero-table{width:100%;border-collapse:collapse;font-size:.8rem}
.tero-table th{font-family:var(--mono);font-size:.65rem;color:var(--gold-dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--dark3);letter-spacing:1px}
.tero-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
.tero-table tr:hover{background:rgba(212,175,55,.03)}
.tero-status{font-family:var(--mono);font-size:.6rem;padding:2px 8px;border-radius:3px;letter-spacing:1px}
.tero-status.complete{background:rgba(0,170,0,.15);color:var(--green-bright);border:1px solid var(--green)}
.tero-status.inprogress{background:rgba(218,165,32,.15);color:var(--yellow);border:1px solid var(--yellow)}
.tero-status.notstarted{background:rgba(255,255,255,.05);color:#666;border:1px solid #444}

/* ===== PIPELINE CARDS ===== */
.pipeline-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pipeline-card{background:var(--dark2);border:1px solid var(--dark3);border-radius:6px;padding:12px;transition:all .3s}
.pipeline-card:hover{border-color:var(--blue);box-shadow:0 0 12px rgba(30,144,255,.15)}
.pipeline-card.pitch-ready{border-color:var(--green);box-shadow:0 0 10px rgba(0,170,0,.15)}
.pipeline-card .target-name{font-weight:700;font-size:.9rem;color:#fff;margin-bottom:4px}
.pipeline-card .target-value{font-family:var(--mono);font-size:.85rem;color:var(--green-bright)}
.pipeline-card .target-score{font-family:var(--mono);font-size:.65rem;color:var(--text-dim);margin-top:4px}
.pipeline-total{text-align:center;margin-top:14px;font-family:var(--mono);padding:10px;background:var(--dark2);border:1px solid var(--gold-dim);border-radius:6px}
.pipeline-total .big{font-size:1.3rem;color:var(--gold)}
.pipeline-total .sub{font-size:.7rem;color:var(--text-dim);margin-top:2px}

/* ===== AUTOMATION LIST ===== */
.auto-list{display:flex;flex-direction:column;gap:6px}
.auto-item{display:flex;align-items:center;gap:12px;background:var(--dark2);border:1px solid var(--dark3);border-radius:4px;padding:10px 14px;transition:border-color .3s}
.auto-item:hover{border-color:var(--dark4)}
.auto-item .auto-name{font-weight:700;font-size:.85rem;color:#fff;min-width:160px}
.auto-item .auto-desc{font-size:.7rem;color:var(--text-dim);flex:1}
.auto-item .auto-status{font-family:var(--mono);font-size:.6rem;padding:2px 8px;border-radius:3px;letter-spacing:1px;white-space:nowrap}
.auto-status.tobuild{background:rgba(218,165,32,.15);color:var(--yellow);border:1px solid var(--yellow)}
.auto-status.planned{background:rgba(255,255,255,.05);color:#666;border:1px solid #444}
.auto-status.sourceready{background:rgba(30,144,255,.12);color:var(--blue);border:1px solid var(--blue)}

/* ===== SPRINT CHECKLIST ===== */
.sprint-days{display:flex;flex-direction:column;gap:10px}
.sprint-day{background:var(--dark2);border:1px solid var(--dark3);border-radius:6px;padding:12px 14px}
.sprint-day-header{font-family:var(--mono);font-size:.7rem;color:var(--gold);letter-spacing:2px;margin-bottom:8px}
.sprint-item{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;user-select:none;transition:opacity .2s}
.sprint-item:hover{opacity:.85}
.sprint-checkbox{width:18px;height:18px;border:2px solid var(--dark4);border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-size:.7rem}
.sprint-checkbox.checked{border-color:var(--green-bright);background:var(--green);color:#fff}
.sprint-item-text{font-size:.8rem;color:var(--text)}
.sprint-item.done .sprint-item-text{text-decoration:line-through;color:var(--text-dim)}

/* ===== LIVE TRIBAL & FEDERAL OPPORTUNITIES ===== */
.live-indicator{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.65rem;color:var(--green-bright);letter-spacing:2px;margin-left:12px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green-bright);animation:livePulse 1.5s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 4px var(--green-bright)}50%{opacity:.3;box-shadow:0 0 12px var(--green-bright)}}
.opps-subtitle{font-family:var(--mono);font-size:.65rem;color:var(--text-dim);letter-spacing:1px;margin-bottom:16px}
.bid-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bid-card{background:var(--dark2);border:1px solid var(--dark3);border-left:4px solid var(--gold);border-radius:6px;padding:14px 14px 14px 16px;transition:border-color .3s,box-shadow .3s}
.bid-card:hover{border-color:var(--gold-dim);box-shadow:0 0 15px rgba(212,175,55,.1)}
.bid-id{font-family:var(--mono);font-size:.6rem;color:var(--text-dim);letter-spacing:1px;margin-bottom:4px}
.bid-title{font-size:.85rem;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.3}
.bid-dates{font-family:var(--mono);font-size:.65rem;color:var(--text-dim);margin-bottom:8px}
.bid-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.play-badge{font-family:var(--mono);font-size:.55rem;padding:3px 10px;border-radius:3px;letter-spacing:.5px;white-space:nowrap;font-weight:700}
.play-badge.bid-direct{background:rgba(0,170,0,.15);color:var(--green-bright);border:1px solid var(--green)}
.play-badge.dropship{background:rgba(218,165,32,.15);color:var(--gold);border:1px solid var(--gold-dim)}
.play-badge.sub-contract{background:rgba(30,144,255,.12);color:var(--blue);border:1px solid var(--blue)}
.play-badge.match-make{background:rgba(255,255,255,.08);color:#999;border:1px solid #666}
.urgency-badge{font-family:var(--mono);font-size:.55rem;padding:3px 10px;border-radius:3px;letter-spacing:1px;white-space:nowrap;font-weight:700}
.urgency-badge.urg-red{background:rgba(204,0,0,.2);color:var(--red-bright);border:1px solid var(--red-bright)}
.urgency-badge.urg-red-pulse{background:rgba(204,0,0,.2);color:var(--red-bright);border:1px solid var(--red-bright);animation:urgPulse 1.2s ease-in-out infinite}
.urgency-badge.urg-orange{background:rgba(230,126,34,.15);color:var(--orange);border:1px solid var(--orange)}
.urgency-badge.urg-yellow{background:rgba(218,165,32,.12);color:var(--yellow);border:1px solid var(--yellow)}
@keyframes urgPulse{0%,100%{opacity:1;box-shadow:0 0 4px rgba(204,0,0,.5)}50%{opacity:.6;box-shadow:0 0 12px rgba(204,0,0,.8)}}
.bid-link{font-size:.65rem;color:var(--gold-dim);margin-top:6px;letter-spacing:.5px}
.bid-source{font-family:var(--mono);font-size:.55rem;color:var(--text-dim);text-align:right;margin-top:14px;letter-spacing:.5px;opacity:.7}
/* Strategy Decision Matrix */
.strategy-matrix{width:100%;border-collapse:collapse;font-size:.75rem;margin-top:20px}
.strategy-matrix th{font-family:var(--mono);font-size:.6rem;color:var(--gold);text-align:left;padding:10px 12px;border-bottom:2px solid var(--gold-dim);letter-spacing:1px;background:rgba(212,175,55,.06)}
.strategy-matrix td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text)}
.strategy-matrix tr:hover{background:rgba(212,175,55,.03)}
.strategy-matrix td:first-child{font-weight:700;color:#fff;white-space:nowrap}
.matrix-label{text-align:center;font-family:var(--mono);font-size:.65rem;color:var(--text-dim);letter-spacing:2px;margin-top:20px;margin-bottom:8px}

/* ===== FORGE PIPELINE ===== */
.forge-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.forge-scroll::-webkit-scrollbar{height:4px}
.forge-scroll::-webkit-scrollbar-track{background:var(--dark3);border-radius:2px}
.forge-scroll::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
.forge-card{min-width:220px;max-width:250px;background:var(--dark2);border:1px solid var(--dark3);border-radius:6px;padding:14px;flex-shrink:0;scroll-snap-align:start;transition:border-color .3s,box-shadow .3s}
.forge-card:hover{border-color:var(--gold-dim);box-shadow:0 0 15px rgba(212,175,55,.1)}
.forge-card.build-now{border-color:var(--red-bright);box-shadow:0 0 12px rgba(204,0,0,.15)}
.forge-card-name{font-size:.9rem;font-weight:700;color:#fff;margin-bottom:4px}
.forge-card-desc{font-size:.7rem;color:var(--text-dim);margin-bottom:8px;font-style:italic}
.forge-card-status{font-family:var(--mono);font-size:.6rem;padding:2px 8px;border-radius:3px;letter-spacing:1px;display:inline-block;margin-bottom:6px}
.forge-card-status.build-now-s{background:rgba(204,0,0,.15);color:var(--red-bright);border:1px solid var(--red-bright)}
.forge-card-status.source-ready-s{background:rgba(30,144,255,.12);color:var(--blue);border:1px solid var(--blue)}
.forge-card-status.planned-s{background:rgba(255,255,255,.05);color:#666;border:1px solid #444}
.forge-card-detail{font-family:var(--mono);font-size:.65rem;color:var(--text-dim);margin-top:4px}
.forge-card-price{font-family:var(--mono);font-size:.8rem;color:var(--green-bright);margin-top:4px}
.forge-mrr{text-align:center;margin-top:14px;font-family:var(--mono);padding:10px;background:var(--dark2);border:1px solid var(--gold-dim);border-radius:6px}
.forge-mrr .big{font-size:1.3rem;color:var(--gold)}
.forge-mrr .sub{font-size:.7rem;color:var(--text-dim);margin-top:2px}

/* ===== DARK ECONOMY ===== */
.dark-econ-container{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.dark-econ-rings{position:relative;width:340px;height:340px;flex-shrink:0}
.ring{position:absolute;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;text-align:center}
.ring-outer{width:340px;height:340px;top:0;left:0;border-color:rgba(204,0,0,.4);background:rgba(204,0,0,.03);animation:ringPulse 4s ease-in-out infinite}
.ring-middle{width:230px;height:230px;top:55px;left:55px;border-color:rgba(212,175,55,.4);background:rgba(212,175,55,.05)}
.ring-inner{width:130px;height:130px;top:105px;left:105px;border-color:rgba(0,170,0,.4);background:rgba(0,170,0,.05)}
@keyframes ringPulse{0%,100%{border-color:rgba(204,0,0,.3);box-shadow:0 0 15px rgba(204,0,0,.05)}50%{border-color:rgba(204,0,0,.6);box-shadow:0 0 30px rgba(204,0,0,.15)}}
.ring-label{font-family:var(--mono);font-size:.55rem;color:var(--text-dim);letter-spacing:.5px;padding:8px;line-height:1.3;max-width:90%}
.ring-label strong{display:block;color:#fff;font-size:.7rem;margin-bottom:2px}
.ring-inner .ring-label strong{color:var(--green-bright)}
.ring-middle .ring-label strong{color:var(--gold)}
.ring-outer .ring-label strong{color:var(--red-bright)}
.dark-econ-stat{flex:1;min-width:280px}
.dark-econ-stat-box{background:var(--dark2);border:1px solid var(--dark3);border-radius:6px;padding:16px;margin-bottom:12px}
.dark-econ-stat-box p{font-size:.8rem;color:var(--text);line-height:1.5}
.dark-econ-stat-box strong{color:var(--gold)}
.dark-econ-powered{font-family:var(--mono);font-size:.6rem;color:var(--red-bright);letter-spacing:2px;text-align:center;margin-top:8px;opacity:.7}

/* ===== SKILLS ARSENAL ===== */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.skill-card{background:var(--dark2);border:1px solid var(--gold-dim);border-radius:6px;padding:12px;transition:all .3s;display:flex;gap:10px;align-items:flex-start}
.skill-card:hover{border-color:var(--gold);box-shadow:0 0 15px rgba(212,175,55,.15)}
.skill-icon{font-size:1.3rem;flex-shrink:0;line-height:1}
.skill-info{flex:1}
.skill-name{font-size:.8rem;font-weight:700;color:#fff;margin-bottom:2px}
.skill-desc{font-size:.65rem;color:var(--text-dim)}

/* ===== COMMAND TERMINAL ===== */
.terminal{background:#000;border:1px solid var(--dark3);border-radius:6px;padding:16px;font-family:var(--mono);overflow:hidden;position:relative;height:260px}
.terminal-header{font-size:.6rem;color:var(--green-bright);letter-spacing:2px;margin-bottom:10px;opacity:.6}
.terminal-scroll{display:flex;flex-direction:column;animation:termScroll 30s linear infinite}
.terminal-line{font-size:.7rem;color:#00CC00;padding:3px 0;white-space:nowrap;opacity:.9}
.terminal-line .ts{color:#006600}
.terminal-line .cmd{color:#00AA00}
.terminal-line .val{color:var(--gold)}
.terminal-cursor{display:inline-block;width:8px;height:14px;background:#00CC00;animation:blink 1s step-end infinite;vertical-align:middle;margin-left:4px}
@keyframes blink{50%{opacity:0}}
@keyframes termScroll{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.terminal-fade-top{position:absolute;top:0;left:0;right:0;height:30px;background:linear-gradient(to bottom,#000,transparent);z-index:1;pointer-events:none}
.terminal-fade-bottom{position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(to top,#000,transparent);z-index:1;pointer-events:none}

/* ===== FOOTER ===== */
.footer{text-align:center;padding:24px 0 12px;border-top:1px solid var(--dark3);margin-top:20px}
.footer p{font-size:.7rem;color:var(--text-dim);margin-bottom:4px;letter-spacing:1px}
.footer .gold{color:var(--gold-dim)}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  html{font-size:13px}
  .app{padding:10px}
  .header h1{font-size:1.4rem;letter-spacing:3px}
  .header .logo{font-size:2rem;letter-spacing:6px}
  .engine-grid{grid-template-columns:1fr 1fr}

  .auto-item{flex-direction:column;align-items:flex-start;gap:6px}

<script>
// ===== PARTICLE GRID BACKGROUND =====
(function(){
  const c=document.getElementById('particle-canvas'),ctx=c.getContext('2d');
  let w,h,particles=[];
  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}
  window.addEventListener('resize',resize);resize();
  for(let i=0;i<60;i++)particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.5});
  function draw(){
    ctx.clearRect(0,0,w,h);
    // Grid lines
    ctx.strokeStyle='rgba(212,175,55,.04)';ctx.lineWidth=.5;
    for(let x=0;x<w;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
    for(let y=0;y<h;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
    // Particles
    particles.forEach((p,i)=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>w)p.vx*=-1;
      if(p.y<0||p.y>h)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(212,175,55,.5)';ctx.fill();
      // Connect nearby particles
      for(let j=i+1;j<particles.length;j++){
        const dx=p.x-particles[j].x,dy=p.y-particles[j].y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<150){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(particles[j].x,particles[j].y);
        ctx.strokeStyle=`rgba(212,175,55,${.12*(1-dist/150)})`;ctx.lineWidth=.5;ctx.stroke()}
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

function RevenueChart(){
  const [animated,setAnimated]=useState(false);
  const [countVal,setCountVal]=useState(0);
  const ref=useRef(null);

  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){setAnimated(true);obs.disconnect()}},{threshold:.2});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);

  useEffect(()=>{
    if(!animated)return;
    const dur=2000,start=performance.now();
    function tick(now){
      const p=Math.min((now-start)/dur,1);
      const ease=1-Math.pow(1-p,3);
      setCountVal(Math.round(YEAR_TOTAL*ease));
      if(p<1)requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  },[animated]);

  const maxTotal=Math.max(...MONTHS.map((_,i)=>REV_DATA.govcon[i]+REV_DATA.intel[i]+REV_DATA.tribal[i]+REV_DATA.saas[i]));

  return(

          const g=REV_DATA.govcon[i],n=REV_DATA.intel[i],t=REV_DATA.tribal[i],s=REV_DATA.saas[i];

              <div className={`chart-stack ${isSep?'september-glow':''}`}>
                {s>0&&<div className="chart-segment saas" style={{height:animated?`${s*scale}px`:'0px'}}></div>}
                {t>0&&<div className="chart-segment tribal" style={{height:animated?`${t*scale}px`:'0px'}}></div>}
                {n>0&&<div className="chart-segment intel" style={{height:animated?`${n*scale}px`:'0px'}}></div>}
                {g>0&&<div className="chart-segment govcon" style={{height:animated?`${g*scale}px`:'0px'}}></div>}
              </div>
              <div className="chart-month">{m}</div>
              <div className="chart-total-label">${(total/1000).toFixed(total<1000?2:0)}K</div>

}

function AutomationStack(){

          <span className={`auto-status ${a.cls}`}>{a.status}</span>
        </div>
      ))}
    </div>
  );
}

function SprintChecklist(){
  const storageKey='delzar-sprint-v1';
  const [checked,setChecked]=useState(()=>{
    try{return JSON.parse(localStorage.getItem(storageKey))||{}}catch(e){return{}}
  });

  const toggle=useCallback((dayIdx,itemIdx)=>{
    setChecked(prev=>{
      const key=`${dayIdx}-${itemIdx}`;
      const next={...prev,[key]:!prev[key]};
      localStorage.setItem(storageKey,JSON.stringify(next));
      return next;
    });
  },[]);

  const totalItems=SPRINT_DAYS.reduce((a,d)=>a+d.items.length,0);
  const doneItems=Object.values(checked).filter(Boolean).length;

  return(
    <div>
      <div style={{fontFamily:'var(--mono)',fontSize:'.75rem',color:'var(--text-dim)',marginBottom:'12px',textAlign:'right'}}>
        {doneItems} / {totalItems} COMPLETE ({Math.round(doneItems/totalItems*100)}%)
      </div>
      <div className="sprint-days">
        {SPRINT_DAYS.map((d,di)=>(
          <div className="sprint-day" key={di}>
            <div className="sprint-day-header">{d.day}</div>
            {d.items.map((item,ii)=>{
              const key=`${di}-${ii}`;
              const isDone=!!checked[key];
              return(
                <div className={`sprint-item ${isDone?'done':''}`} key={ii} onClick={()=>toggle(di,ii)}>
                  <div className={`sprint-checkbox ${isDone?'checked':''}`}>{isDone?'\u2713':''}</div>
                  <span className="sprint-item-text">{item}</span>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}
